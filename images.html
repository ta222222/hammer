<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☆ images ☆</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    p,
    a {
      font-family: Helvetica Neue, sans-serif;
      margin: 0;
      padding: 0;
      font-size: 0.75rem;
      line-height: 1.75em;
      color: inherit;
      text-decoration: none;
      text-transform: uppercase;
    }

    body.normal {
      background-color: white;
      color: black;
    }

    body.heated {
      background-color: red;
      color: white;
    }

    /* Ensure all text elements are white in heated mode */
    body.heated,
    body.heated *,
    body.heated a,
    body.heated button,
    body.heated div,
    body.heated p,
    body.heated span {
      color: white;
    }

    nav {
      padding: 1.5em 1.5em 1em;
      display: flex;
      gap: 0.75em;
      margin-bottom: 1.5em;
      position: sticky;
      top: 0;
      background-color: inherit;
      z-index: 10;
    }

    body.normal nav {
      background-color: white;
    }

    body.heated nav {
      background-color: red;
    }

    body.heated nav a,
    body.heated nav button,
    body.heated nav div {
      color: white;
    }

    /* Gallery wrapper: full-width, left-aligned, with uniform vertical spacing */
    .gallery {
      width: 100%;
      max-width: 100vw;
      padding: 0 1.5em;
      display: flex;
      flex-direction: column;
      gap: 1.5em;
    }

    /* A row holds one or more images that share the width evenly */
    .images-row {
      display: flex;
      flex-direction: row;
      gap: 1.5em;
      align-items: flex-start;
    }

    /* Desktop sizing: half-width images, matching the original layout */
    .images-row img {
      display: block;
      width: 50%;
      height: auto;
      min-width: 0;
    }

    /* Crosshair cursor on image hover */
    img:hover {
      cursor: crosshair;
    }

    /* Customize text selection to have red background with white text */
    *::selection {
      background-color: red;
      color: white;
    }

    .bottom-subtext {
      margin-top: 6em;
      margin-bottom: 2em;
    }

    /* Mobile: images span the full width of the viewport */
    @media only screen and (max-width: 767px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .gallery {
        max-width: 100%;
        padding: 0;
        gap: 0;
      }

      .images-row {
        flex-direction: column;
        gap: 0;
      }

      .images-row img {
        width: 100%;
      }

      .bottom-subtext {
        margin-top: 4em;
        padding: 0 1.5em;
      }
    }

    @media only screen and (max-width: 320px) {
      nav {
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="https://ta222222.github.io/hammer/" class="navbar-link">home</a>
    <a href="https://ta222222.github.io/hammer/images" class="navbar-link"><b>images</b></a>
    <div id="datetime"></div>
    <a href="#" id="modeToggleLink">heated mode</a>
  </nav>


  <div class="gallery">

            <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG1211.webp" alt="RIMG1211" />
    </div>

       <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG0945.webp" alt="RIMG0945" />
       </div>

    
    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG1176.webp" alt="RIMG1176" />
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG0363.webp" alt="RIMG0363" />
    </div>


    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG0011.webp" alt="RIMG0011" />
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG0278.webp" alt="RIMG0278" />
    </div>
    
    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/DSCN0113%20copy%202.png" alt="DSCN0113" />
            <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/IMG_2747.jpg" alt="IMG_2747" />
    </div>

    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/560.jpg" alt="560" />
    </div>

    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG0715.JPG" alt="RIMG0715" />
    </div>

    <div class="images-row">
      <img src="https://raw.githubusercontent.com/ta222222/hammer/refs/heads/main/pix/RIMG1529.JPG" alt="RIMG1529" />
    </div>

    <p class="bottom-subtext">© 2026 hammer mag</p>

    <footer class="footer"></footer>
  </div>

    <script>
      // Mode toggle logic
      const modeToggleLink = document.getElementById('modeToggleLink');

      modeToggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        document.body.classList.toggle('heated');
        document.body.classList.toggle('normal');
        modeToggleLink.textContent = document.body.classList.contains('heated') ? 'normal mode' : 'heated mode';
      });

      if (localStorage.getItem('mode') === 'heated') {
        document.body.classList.add('heated');
        document.body.classList.remove('normal');
        modeToggleLink.textContent = 'normal mode';
      } else {
        document.body.classList.add('normal');
        document.body.classList.remove('heated');
        modeToggleLink.textContent = 'heated mode';
      }

      // Date/time update
      function updateDateTime() {
        const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const options = {
          timeZone: userTimeZone,
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        };
        const currentDateTime = new Date().toLocaleString('en-US', options);
        document.getElementById('datetime').innerText = currentDateTime;
      }
      setInterval(updateDateTime, 1000);
      updateDateTime();

      // Loading links (if any)
      const loadingLinks = document.querySelectorAll('.loading-link');
      loadingLinks.forEach(link => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          document.body.classList.add('loading-link-style');
          const targetURL = link.getAttribute('href');
          setTimeout(() => {
            window.location.href = targetURL;
          }, 500);
        });
      });

    </script>
</body>
</html>
